<svg xmlns="http://www.w3.org/2000/svg" width="900" height="220" viewBox="0 0 900 220" role="img" aria-label="Odell Chacón — Desarrollador Full Stack">
<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#dafbe1"/><stop offset="1" stop-color="#ffffff"/></linearGradient>
<pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#d0d7de" stroke-width="1" opacity=".35"/></pattern>
<style>.n{font:700 44px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#1f2328}.r{font:500 20px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#57606a}.t{font:500 14px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#2da44e}.cur{animation:b 1.1s steps(1) infinite}@keyframes b{50%{opacity:0}}.fade{animation:f 1.2s ease-out both}@keyframes f{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}</style></defs>
<rect width="900" height="220" rx="14" fill="url(#g)"/><rect width="900" height="220" rx="14" fill="url(#grid)"/><rect x=".5" y=".5" width="899" height="219" rx="14" fill="none" stroke="#d0d7de"/>
<g class="fade"><text x="48" y="92" class="n">Odell Chacón</text><text x="48" y="128" class="r">Desarrollador Full Stack · Python · Django · PostgreSQL · React</text><text x="48" y="172" class="t">$ construyo sistemas que reemplazan procesos manuales<tspan class="cur">▍</tspan></text></g>
<g transform="translate(760 70)" opacity=".9"><rect width="92" height="92" rx="20" fill="none" stroke="#1a7f37" stroke-width="2"/><text x="46" y="58" text-anchor="middle" style="font:700 30px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#2da44e">&lt;/&gt;</text></g></svg>